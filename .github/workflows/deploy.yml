name: Deploy to MonsterASP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Enable Long Path Support
      run: |
        New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
      shell: powershell

    - name: Build and Publish Locally
      run: dotnet publish -c Release -o ./publish_output

    - name: Deploy to MonsterASP using MSDeploy
      run: |
        & "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe" -verb:sync -source:contentPath="$(Get-Location)\publish_output" -dest:contentPath="site65905",ComputerName="https://site65905.siteasp.net:8172/msdeploy.axd",UserName="site65905",Password="${{ secrets.MONSTERASP_PASSWORD }}",AuthType="Basic" -allowUntrusted

