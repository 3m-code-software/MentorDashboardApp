name: Deploy to MonsterASP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Build and Publish to MonsterASP
      run: |
        dotnet publish -c Release /p:PublishMethod=MSDeploy /p:PublishSiteName="site65905" /p:PublishUrl="https://site65905.siteasp.net:8172/msdeploy.axd" /p:UserName="site65905" /p:Password="${{ secrets.MONSTERASP_PASSWORD }}" /p:AllowUntrustedCertificate=True /p:DeployIisAppPath="site65905"
